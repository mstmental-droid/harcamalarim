<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HarcamalarımApp</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-between p-4">

    <!-- Ana Konteyner -->
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col h-[90vh]">
        
        <!-- Üst Bilgi / Başlık -->
        <div class="bg-indigo-600 text-white p-6 text-center shadow-md">
            <h1 class="text-2xl font-bold">HarcamalarımApp</h1>
            <p class="text-xs text-indigo-200 mt-1">Ortak Bütçe Takibi</p>
        </div>

        <!-- İçerik Alanı (Harcama Listesi ve Özet) -->
        <div class="flex-1 p-4 overflow-y-auto">
            <div class="text-center text-gray-500 my-8" id="bos-mesaj">
                Henüz harcama eklenmedi.
            </div>
            <div id="harcama-listesi" class="space-y-3">
                <!-- Harcamalar buraya dinamik olarak eklenecek -->
            </div>
        </div>

        <!-- Alt Sabit Alan ve Büyük Buton -->
        <div class="p-4 bg-gray-50 border-t border-gray-100">
            <button onclick="modalAc()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-lg transition duration-200 text-lg flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
                Harcama Ekle
            </button>
        </div>
    </div>

    <!-- Harcama Ekle Modal / Ekranı -->
    <div id="harcama-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-md rounded-2xl p-6 shadow-2xl animate-fade-in">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Yeni Harcama Ekle</h2>
            
            <form id="harcama-form" onsubmit="harcamaKaydet(event)" class="space-y-4">
                <!-- Kategori Seçimi -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Kategori</label>
                    <select id="kategori" required class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
                        <option value="" disabled selected>Kategori Seçin</option>
                        <option value="Maket">Maket</option>
                        <option value="Sigara">Sigara</option>
                        <option value="Yemek">Yemek</option>
                        <option value="Cafe">Cafe</option>
                        <option value="Online Alışveriş">Online Alışveriş</option>
                        <option value="Yolculuk">Yolculuk</option>
                        <option value="Diğer">Diğer</option>
                    </select>
                </div>

                <!-- Tutar Girişi (Virgüllü) -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Tutar (TL)</label>
                    <input type="text" id="tutar" placeholder="0,00" required 
                           class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                           oninput="tutarBicimlendir(this)">
                </div>

                <!-- Butonlar -->
                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="modalKapat()" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-3 rounded-xl transition duration-200">
                        İptal
                    </button>
                    <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition duration-200">
                        Kaydet
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase ve Uygulama Mantığı -->
    <script type="module">
        // Firebase Modülleri (Firebase v10 CDN)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Gerçek Firebase Yapılandırmanız
        const firebaseConfig = {
            apiKey: "AIzaSyBVtbl20mGQJda1QmqD9Bm-4PNyRBuWnUY",
            authDomain: "harcamalarimapp.firebaseapp.com",
            databaseURL: "https://harcamalarimapp-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "harcamalarimapp",
            storageBucket: "harcamalarimapp.firebasestorage.app",
            messagingSenderId: "518005508600",
            appId: "1:518005508600:web:ee7fe04274512394716e0d"
        };

        // Firebase Başlatma
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Global Fonksiyonlar için Window'a Atama
        window.modalAc = function() {
            document.getElementById('harcama-modal').classList.remove('hidden');
            document.getElementById('harcama-modal').classList.add('flex');
        }

        window.modalKapat = function() {
            document.getElementById('harcama-modal').classList.add('hidden');
            document.getElementById('harcama-modal').classList.remove('flex');
            document.getElementById('harcama-form').reset();
        }

        // Virgüllü Tutar Düzenleme Yardımcısı
        window.tutarBicimlendir = function(input) {
            let value = input.value.replace(/\./g, '').replace(',', '.');
        }

        // Harcama Kaydetme
        window.harcamaKaydet = function(event) {
            event.preventDefault();
            
            const kategori = document.getElementById('kategori').value;
            let tutarStr = document.getElementById('tutar').value.replace(',', '.');
            const tutar = parseFloat(tutarStr);

            if (isNaN(tutar)) {
                alert("Lütfen geçerli bir tutar girin.");
                return;
            }

            const tarih = new Date().toISOString();

            // Firebase'e Gönderim
            const harcamalarRef = ref(db, 'harcamalar');
            push(harcamalarRef, {
                kategori: kategori,
                tutar: tutar,
                tarih: tarih
            }).then(() => {
                modalKapat();
            }).catch((error) => {
                console.error("Kayıt hatası: ", error);
                alert("Harcama kaydedilemedi.");
            });
        }

        // Firebase'den Canlı Veri Dinleme (Eşzamanlı Senkronizasyon)
        const harcamalarRef = ref(db, 'harcamalar');
        onValue(harcamalarRef, (snapshot) => {
            const data = snapshot.val();
            const listeDiv = document.getElementById('harcama-listesi');
            const bosMesaj = document.getElementById('bos-mesaj');
            
            listeDiv.innerHTML = '';

            if (data) {
                bosMesaj.classList.add('hidden');
                const harcamalar = Object.entries(data).reverse();

                harcamalar.forEach(([id, item]) => {
                    const tarihObj = new Date(item.tarih);
                    const tarihFormatli = tarihObj.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
                    
                    const itemElement = document.createElement('div');
                    itemElement.className = "bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center";
                    itemElement.innerHTML = `
                        <div>
                            <span class="inline-block px-2.5 py-1 text-xs font-semibold bg-indigo-50 text-indigo-600 rounded-lg mb-1">${item.kategori}</span>
                            <p class="text-xs text-gray-400">${tarihFormatli}</p>
                        </div>
                        <div class="text-right">
                            <span class="text-lg font-bold text-gray-800">${item.tutar.toLocaleString('tr-TR', { minimumFractionDigits: 2 })} TL</span>
                        </div>
                    `;
                    listeDiv.appendChild(itemElement);
                });
            } else {
                bosMesaj.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
