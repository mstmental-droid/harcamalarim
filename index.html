<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>HarcamalarımApp</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-[#12141c] text-slate-100 flex flex-col items-center justify-center min-h-screen p-3 font-sans select-none">

    <!-- Giriş PIN Ekranı -->
    <div id="pin-ekrani" class="fixed inset-0 bg-[#12141c] z-50 flex flex-col items-center justify-center p-6">
        <div class="w-full max-w-sm bg-[#161922] p-8 rounded-3xl shadow-2xl border border-slate-800 text-center" onclick="pinAlninaTikla()">
            <h2 class="text-2xl font-black text-slate-100 mb-2">ÇOK HARCAMA!</h2>
            <p class="text-xs text-slate-400 mb-6">Hadi o meşhur şifreyi gir</p>
            
            <input type="password" id="pin-input" maxlength="4" placeholder="••••" inputmode="numeric" pattern="[0-9]*"
                   class="w-full text-center text-3xl tracking-widest p-4 bg-[#1e222d] border border-slate-700 rounded-2xl text-slate-100 focus:outline-none focus:border-[#ff5722] mb-6 font-mono pointer-events-none"
                   readonly>
            
            <button type="button" class="w-full bg-[#ff5722] text-white font-bold py-3.5 rounded-2xl shadow-lg active:scale-95 transition">
                SALAK AŞMİ
            </button>

            <p id="pin-hata" class="text-red-500 text-xs font-semibold mt-4 hidden">Hatalı PIN! Tekrar deneyin.</p>
        </div>
    </div>

    <!-- Görünmez ve Gerçek Sayı Giriş Alanı -->
    <input type="text" id="gizli-input" maxlength="4" inputmode="numeric" pattern="[0-9]*" 
           class="absolute opacity-0 pointer-events-none" oninput="pinGercekGiris(this)">

    <!-- Açılır Menü (Drawer) -->
    <div id="yan-menu" class="fixed inset-0 bg-black/60 z-50 hidden backdrop-blur-sm transition-opacity duration-300" onclick="menuKapat(event)">
        <div class="absolute left-0 top-0 bottom-0 w-4/5 max-w-xs bg-[#161922] p-5 shadow-2xl border-r border-slate-800 flex flex-col transform -translate-x-full transition-transform duration-300" id="menu-icerik" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center border-b border-slate-800 pb-4 mb-4">
                <h3 class="text-lg font-bold text-slate-100">Kategori Toplamları</h3>
                <button onclick="menuKapat()" class="text-slate-400 hover:text-white p-1">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <!-- Kategori Listesi Dinamik Gelecek -->
            <div id="menu-kategori-listesi" class="flex-1 overflow-y-auto space-y-2.5 no-scrollbar">
                <!-- Kategoriler buraya eklenecek -->
            </div>
        </div>
    </div>

    <!-- Ana Konteyner -->
    <div class="w-full max-w-md bg-[#161922] rounded-3xl shadow-2xl overflow-hidden flex flex-col h-[92vh] border border-slate-800 relative">
        
        <!-- Üst Başlık, Menü Butonu ve Ay Değiştirici -->
        <div class="p-4 text-center shrink-0 border-b border-slate-800/80 bg-[#161922] relative">
            <!-- Sol Üst Üç Çizgi Menü Butonu -->
            <button onclick="menuAc()" class="absolute left-4 top-4 text-slate-300 hover:text-white p-1 transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>

            <h1 class="text-xl font-extrabold tracking-wide text-slate-100">HARCAMALARIMIZ</h1>
            <p class="text-xs font-medium text-slate-400 mt-0.5">Medet Neynoş ve Aşmi</p>
            
            <!-- Genel Toplam Harcama Alanı -->
            <div class="mt-1.5 text-orange-400 font-extrabold text-sm" id="genel-toplam-yazi">
                Toplam: 0,00 TL
            </div>
            
            <!-- Ay Değiştirici -->
            <div class="flex flex-col mt-2.5 bg-[#1e222d] py-2 px-3 rounded-2xl border border-slate-700/50">
                <div class="flex items-center justify-between">
                    <button onclick="ayDegistir(-1)" class="w-8 h-8 flex items-center justify-center text-slate-300 hover:text-white hover:bg-slate-700/50 rounded-xl transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
                    </button>
                    <span id="aktif-ay-yazisi" class="text-base font-bold text-slate-100 tracking-wide">Eylül 2026</span>
                    <button onclick="ayDegistir(1)" class="w-8 h-8 flex items-center justify-center text-slate-300 hover:text-white hover:bg-slate-700/50 rounded-xl transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
                    </button>
                </div>
                <!-- Aylık Toplam Tutar -->
                <span id="aylik-toplam-yazi" class="text-xs text-orange-400 font-semibold mt-0.5">Aylık Toplam: 0,00 TL</span>
            </div>
        </div>

        <!-- Günler Şeridi -->
        <div class="bg-[#12141c] border-b border-slate-800 py-2.5 overflow-x-auto no-scrollbar flex items-center gap-2 px-4 shrink-0" id="gun-seridi">
            <!-- Günler -->
        </div>

        <!-- İçerik Alanı (Harcama Listesi) -->
        <div class="flex-1 p-4 overflow-y-auto space-y-3 bg-[#12141c] no-scrollbar" style="-webkit-overflow-scrolling: touch;">
            <div class="text-center text-slate-500 my-12" id="bos-mesaj">
                Bu tarihte henüz harcama eklenmedi.
            </div>
            <div id="harcama-listesi" class="space-y-3">
                <!-- Harcamalar buraya dinamik olarak eklenecek -->
            </div>
        </div>
    </div>

    <!-- Sağ altta yüzen yuvarlak artı butonu -->
    <button onclick="modalAc()" class="fixed bottom-16 right-6 w-14 h-14 bg-[#ff5722] hover:bg-[#f4511e] text-white rounded-2xl shadow-xl shadow-orange-900/50 flex items-center justify-center transition-all transform hover:scale-105 active:scale-95 z-40">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4" />
        </svg>
    </button>

    <!-- Harcama Ekle Modal -->
    <div id="harcama-modal" class="fixed inset-0 bg-black/70 hidden items-center justify-center p-4 z-50 backdrop-blur-sm">
        <div class="bg-[#1e222d] w-full max-w-md rounded-3xl p-6 shadow-2xl border border-slate-700 text-slate-100">
            <h2 class="text-xl font-bold text-slate-100 mb-4 border-b border-slate-700 pb-3">Yeni Harcama Ekle</h2>
            
            <form id="harcama-form" onsubmit="harcamaKaydet(event)" class="space-y-4">
                <!-- Kategori Seçimi -->
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-1">Kategori</label>
                    <select id="kategori" required onchange="kategoriKontrol(this)" class="w-full p-3.5 border border-slate-700 rounded-2xl focus:ring-2 focus:ring-[#ff5722] focus:outline-none bg-[#12141c] text-slate-100 font-medium">
                        <option value="" disabled selected>Kategori Seçin</option>
                        <option value="Maket">Maket</option>
                        <option value="Sigara">Sigara</option>
                        <option value="Aşmiye Özel">Aşmiye Özel</option>
                        <option value="Neynoşa Özel">Neynoşa Özel</option>
                        <option value="Medoya Özel">Medoya Özel</option>
                        <option value="Yemek">Yemek</option>
                        <option value="Cafe">Cafe</option>
                        <option value="Online Alışveriş">Online Alışveriş</option>
                        <option value="Yolculuk">Yolculuk</option>
                        <option value="Diğer">Diğer</option>
                    </select>
                </div>

                <!-- Açıklama Kutusu -->
                <div id="aciklama-alani" class="hidden">
                    <label class="block text-sm font-semibold text-slate-300 mb-1">Açıklama</label>
                    <input type="text" id="aciklama" placeholder="Açıklama" 
                           class="w-full p-3.5 border border-slate-700 rounded-2xl focus:ring-2 focus:ring-[#ff5722] focus:outline-none text-sm bg-[#12141c] text-slate-100 placeholder:text-slate-600">
                </div>

                <!-- Tutar Girişi -->
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-1">Tutar (TL)</label>
                    <input type="text" id="tutar" placeholder="0,00" required inputmode="numeric"
                           class="w-full p-3.5 border border-slate-700 rounded-2xl focus:ring-2 focus:ring-[#ff5722] focus:outline-none text-lg font-bold bg-[#12141c] text-slate-100 placeholder:text-slate-600"
                           oninput="tutarBicimlendir(this)">
                </div>

                <!-- Butonlar -->
                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="modalKapat()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-3.5 rounded-2xl transition duration-200">
                        İptal
                    </button>
                    <button type="submit" class="flex-1 bg-[#ff5722] hover:bg-[#f4511e] text-white font-semibold py-3.5 rounded-2xl shadow-lg transition duration-200">
                        Kaydet
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase ve Uygulama Mantığı -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBVtbl20mGQJda1QmqD9Bm-4PNyRBuWnUY",
            authDomain: "harcamalarimapp.firebaseapp.com",
            databaseURL: "https://harcamalarimapp-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "harcamalarimapp",
            storageBucket: "harcamalarimapp.firebasestorage.app",
            messagingSenderId: "518005508600",
            appId: "1:518005508600:web:ee7fe04274512394716e0d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.menuAc = function() {
            const menu = document.getElementById('yan-menu');
            const icerik = document.getElementById('menu-icerik');
            menu.classList.remove('hidden');
            setTimeout(() => {
                icerik.classList.remove('-translate-x-full');
            }, 10);
            kategoriToplamlariniGoster();
        }

        window.menuKapat = function() {
            const menu = document.getElementById('yan-menu');
            const icerik = document.getElementById('menu-icerik');
            icerik.classList.add('-translate-x-full');
            setTimeout(() => {
                menu.classList.add('hidden');
            }, 300);
        }

        function kategoriToplamlariniGoster() {
            const listeDiv = document.getElementById('menu-kategori-listesi');
            listeDiv.innerHTML = '';

            const kategoriListesi = [
                "Maket", "Sigara", "Aşmiye Özel", "Neynoşa Özel", 
                "Medoya Özel", "Yemek", "Cafe", "Online Alışveriş", "Yolculuk", "Diğer"
            ];

            let kategoriToplamlar = {};
            kategoriListesi.forEach(kat => kategoriToplamlar[kat] = 0);

            if (window.sonVeriler) {
                Object.values(window.sonVeriler).forEach(item => {
                    if (kategoriToplamlar[item.kategori] !== undefined) {
                        kategoriToplamlar[item.kategori] += item.tutar;
                    }
                });
            }

            kategoriListesi.forEach(kat => {
                const toplam = kategoriToplamlar[kat];
                const satir = document.createElement('div');
                satir.className = "flex justify-between items-center p-3 bg-[#1e222d] rounded-xl border border-slate-800";
                satir.innerHTML = `
                    <span class="text-sm font-semibold text-slate-300">${kat}</span>
                    <span class="text-sm font-bold text-orange-400">${toplam.toLocaleString('tr-TR', { minimumFractionDigits: 2 })} TL</span>
                `;
                listeDiv.appendChild(satir);
            });
        }

        window.pinAlninaTikla = function() {
            const gizliInput = document.getElementById('gizli-input');
            gizliInput.focus();
        }

        window.onload = function() {
            setTimeout(() => {
                const gizliInput = document.getElementById('gizli-input');
                if (gizliInput) gizliInput.focus();
            }, 300);
        };

        window.pinGercekGiris = function(input) {
            let val = input.value.replace(/[^0-9]/g, '');
            if (val.length > 4) val = val.slice(0, 4);
            input.value = val;

            let masked = '';
            for (let i = 0; i < val.length; i++) {
                masked += '•';
            }
            document.getElementById('pin-input').value = masked;

            if (val === "0000") {
                document.getElementById('pin-ekrani').classList.add('hidden');
                input.blur();
            } else if (val.length === 4) {
                document.getElementById('pin-hata').classList.remove('hidden');
                setTimeout(() => {
                    input.value = '';
                    document.getElementById('pin-input').value = '';
                    document.getElementById('pin-hata').classList.add('hidden');
                }, 1000);
            }
        }

        let simdikiTarih = new Date();
        let secilenAy = simdikiTarih.getMonth(); 
        let secilenYil = simdikiTarih.getFullYear();
        let secilenGun = simdikiTarih.getDate();

        const aylarListesi = [
            "Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", 
            "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"
        ];

        window.sonVeriler = null;

        window.kategoriKontrol = function(select) {
            const alan = document.getElementById('aciklama-alani');
            const aciklamaInput = document.getElementById('aciklama');
            const aciklamaGerektirenler = ['Aşmiye Özel', 'Neynoşa Özel', 'Medoya Özel', 'Diğer'];
            
            if (aciklamaGerektirenler.includes(select.value)) {
                alan.classList.remove('hidden');
            } else {
                alan.classList.add('hidden');
                aciklamaInput.value = '';
            }
        }

        window.ayDegistir = function(yon) {
            secilenAy += yon;
            if (secilenAy > 11) {
                secilenAy = 0;
                secilenYil++;
            } else if (secilenAy < 0) {
                secilenAy = 11;
                secilenYil--;
            }
            secilenGun = 1; 
            ekraniGuncelle();
        }

        function ekraniGuncelle() {
            document.getElementById('aktif-ay-yazisi').innerText = `${aylarListesi[secilenAy]} ${secilenYil}`;
            
            let genelToplam = 0;
            let aylikToplam = 0;

            if (window.sonVeriler) {
                Object.values(window.sonVeriler).forEach(item => {
                    genelToplam += item.tutar;
                    const hTarih = new Date(item.tarih);
                    if (hTarih.getMonth() === secilenAy && hTarih.getFullYear() === secilenYil) {
                        aylikToplam += item.tutar;
                    }
                });
            }

            document.getElementById('genel-toplam-yazi').innerText = `Toplam: ${genelToplam.toLocaleString('tr-TR', { minimumFractionDigits: 2 })} TL`;
            document.getElementById('aylik-toplam-yazi').innerText = `Aylık Toplam: ${aylikToplam.toLocaleString('tr-TR', { minimumFractionDigits: 2 })} TL`;

            gunSeridiniOlustur();
            verileriIsleVeGoster(window.sonVeriler);
        }

        function gunSeridiniOlustur() {
            const gunSeritDiv = document.getElementById('gun-seridi');
            gunSeritDiv.innerHTML = '';

            const toplamGunSayisi = new Date(secilenYil, secilenAy + 1, 0).getDate();

            let gunlukToplamlar = {};
            if (window.sonVeriler) {
                Object.values(window.sonVeriler).forEach(item => {
                    const hTarih = new Date(item.tarih);
                    if (hTarih.getMonth() === secilenAy && hTarih.getFullYear() === secilenYil) {
                        const g = hTarih.getDate();
                        gunlukToplamlar[g] = (gunlukToplamlar[g] || 0) + item.tutar;
                    }
                });
            }

            for (let gun = 1; gun <= toplamGunSayisi; gun++) {
                const isSelected = (gun === secilenGun);
                const harcamaVarMi = gunlukToplamlar[gun] > 0;
                const gunBtn = document.createElement('button');

                const tarihObj = new Date(secilenYil, secilenAy, gun);
                const gunAdi = tarihObj.toLocaleDateString('tr-TR', { weekday: 'short' });

                gunBtn.className = `px-3 py-2 rounded-2xl transition-all duration-200 whitespace-nowrap shrink-0 flex flex-col items-center justify-center min-w-[55px] ${
                    isSelected
                        ? 'bg-[#ff5722] text-white shadow-md scale-105 ring-2 ring-orange-400'
                        : harcamaVarMi 
                            ? 'bg-[#252a37] text-orange-400 border border-slate-700 font-bold' 
                            : 'bg-[#161922] text-slate-400 hover:bg-[#252a37] border border-slate-800'
                }`;

                let tutarMetni = harcamaVarMi ? `${gunlukToplamlar[gun].toLocaleString('tr-TR', { maximumFractionDigits: 0 })}₺` : '';

                gunBtn.innerHTML = `
                    <span class="text-[10px] ${isSelected ? 'text-orange-100' : 'opacity-60'}">${gunAdi}</span>
                    <span class="text-sm font-black">${gun}</span>
                    ${tutarMetni ? `<span class="text-[10px] font-extrabold mt-0.5 ${isSelected ? 'text-white bg-orange-700/60 px-1.5 py-0.5 rounded-md' : 'text-orange-400'}">${tutarMetni}</span>` : ''}
                `;

                gunBtn.onclick = () => {
                    secilenGun = gun;
                    gunSeridiniOlustur();
                    verileriIsleVeGoster(window.sonVeriler);
                };

                gunSeritDiv.appendChild(gunBtn);
            }
        }

        window.modalAc = function() {
            document.getElementById('harcama-modal').classList.remove('hidden');
            document.getElementById('harcama-modal').classList.add('flex');
        }

        window.modalKapat = function() {
            document.getElementById('harcama-modal').classList.add('hidden');
            document.getElementById('harcama-modal').classList.remove('flex');
            document.getElementById('harcama-form').reset();
            document.getElementById('aciklama-alani').classList.add('hidden');
        }

        window.tutarBicimlendir = function(input) {
            let value = input.value.replace(/\./g, '').replace(',', '.');
        }

        window.harcamaKaydet = function(event) {
            event.preventDefault();
            
            const kategori = document.getElementById('kategori').value;
            const aciklama = document.getElementById('aciklama').value.trim();
            let tutarStr = document.getElementById('tutar').value.replace(',', '.');
            const tutar = parseFloat(tutarStr);

            if (isNaN(tutar)) {
                alert("Lütfen geçerli bir tutar girin.");
                return;
            }

            const tarih = new Date().toISOString();

            const harcamalarRef = ref(db, 'harcamalar');
            push(harcamalarRef, {
                kategori: kategori,
                aciklama: aciklama,
                tutar: tutar,
                tarih: tarih
            }).then(() => {
                modalKapat();
            }).catch((error) => {
                console.error("Kayıt hatası: ", error);
                alert("Harcama kaydedilemedi.");
            });
        }

        window.harcamaSil = function(id) {
            if (confirm("Bu harcamayı silmek istediğinizden emin misiniz?")) {
                const itemRef = ref(db, `harcamalar/${id}`);
                remove(itemRef).catch((error) => {
                    console.error("Silme hatası: ", error);
                    alert("Harcama silinemedi.");
                });
            }
        }

        function verileriIsleVeGoster(data) {
            const listeDiv = document.getElementById('harcama-listesi');
            const bosMesaj = document.getElementById('bos-mesaj');
            
            listeDiv.innerHTML = '';

            if (data) {
                const harcamalar = Object.entries(data).reverse();
                
                const filtrelenmisHarcamalar = harcamalar.filter(([id, item]) => {
                    const hTarih = new Date(item.tarih);
                    return hTarih.getMonth() === secilenAy && 
                           hTarih.getFullYear() === secilenYil && 
                           hTarih.getDate() === secilenGun;
                });

                if (filtrelenmisHarcamalar.length > 0) {
                    bosMesaj.classList.add('hidden');
                    
                    filtrelenmisHarcamalar.forEach(([id, item]) => {
                        const tarihObj = new Date(item.tarih);
                        const zamanStr = tarihObj.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });

                        const kategoriMetni = item.aciklama ? `${item.kategori} (${item.aciklama})` : item.kategori;

                        const container = document.createElement('div');
                        container.className = "relative overflow-hidden rounded-2xl";

                        const deleteBtn = document.createElement('button');
                        deleteBtn.className = "absolute inset-y-0 right-0 w-24 bg-red-600 text-white font-bold flex items-center justify-center gap-1 text-sm transition active:bg-red-700";
                        deleteBtn.innerHTML = `
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                            Sil
                        `;
                        deleteBtn.onclick = () => window.harcamaSil(id);
                        container.appendChild(deleteBtn);

                        const itemElement = document.createElement('div');
                        itemElement.className = "relative bg-[#1e222d] p-4 rounded-2xl shadow-md border border-slate-800 flex justify-between items-center text-slate-100 transition-transform duration-150 cursor-grab select-none";
                        itemElement.innerHTML = `
                            <div>
                                <span class="inline-block px-3 py-1 text-xs font-bold bg-[#252a37] text-orange-400 rounded-lg mb-1 pointer-events-none">${kategoriMetni}</span>
                                <p class="text-xs text-slate-400 pointer-events-none">Saat: ${zamanStr}</p>
                            </div>
                            <div class="text-right pointer-events-none">
                                <span class="text-lg font-black text-slate-100">${item.tutar.toLocaleString('tr-TR', { minimumFractionDigits: 2 })} TL</span>
                            </div>
                        `;

                        let startX = 0;
                        let currentX = 0;
                        let isDragging = false;

                        function onStart(e) {
                            startX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
                            isDragging = true;
                            itemElement.style.transition = 'none';
                        }

                        function onMove(e) {
                            if (!isDragging) return;
                            currentX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
                            const diff = currentX - startX;
                            if (diff < 0 && diff >= -110) {
                                itemElement.style.transform = `translateX(${diff}px)`;
                            }
                        }

                        function onEnd() {
                            if (!isDragging) return;
                            isDragging = false;
                            itemElement.style.transition = 'transform 0.2s ease-out';
                            const diff = currentX - startX;
                            if (diff < -40) {
                                itemElement.style.transform = 'translateX(-96px)';
                            } else {
                                itemElement.style.transform = 'translateX(0px)';
                            }
                        }

                        itemElement.addEventListener('touchstart', onStart, { passive: true });
                        itemElement.addEventListener('touchmove', onMove, { passive: true });
                        itemElement.addEventListener('touchend', onEnd);

                        itemElement.addEventListener('mousedown', onStart);
                        window.addEventListener('mousemove', (e) => { if (isDragging) onMove(e); });
                        window.addEventListener('mouseup', () => { if (isDragging) onEnd(); });

                        container.appendChild(itemElement);
                        listeDiv.appendChild(container);
                    });
                } else {
                    bosMesaj.innerText = `${secilenGun} ${aylarListesi[secilenAy]} ${secilenYil} tarihinde harcama bulunmuyor.`;
                    bosMesaj.classList.remove('hidden');
                }
            } else {
                bosMesaj.innerText = "Henüz harcama eklenmedi.";
                bosMesaj.classList.remove('hidden');
            }
        }

        const harcamalarRef = ref(db, 'harcamalar');
        onValue(harcamalarRef, (snapshot) => {
            window.sonVeriler = snapshot.val();
            ekraniGuncelle();
        });

        ekraniGuncelle();
    </script>
</body>
</html>
