<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HarcamalarımApp</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-between p-4">

    <!-- Ana Konteyner -->
    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden flex flex-col h-[90vh] border border-orange-100">
        
        <!-- Üst Bilgi / Başlık - Neon Turuncu -->
        <div class="bg-orange-600 text-white p-6 text-center shadow-lg">
            <h1 class="text-2xl font-black tracking-wider text-orange-100 drop-shadow-[0_0_8px_rgba(255,255,255,0.6)]">HARCAMALARIM</h1>
            <p class="text-xs text-orange-200 mt-1 font-medium">Ortak Bütçe Takibi</p>
        </div>

        <!-- İçerik Alanı (Harcama Listesi ve Özet) -->
        <div class="flex-1 p-4 overflow-y-auto bg-slate-50">
            <div class="text-center text-gray-400 my-8" id="bos-mesaj">
                Henüz harcama eklenmedi.
            </div>
            <div id="harcama-listesi" class="space-y-3">
                <!-- Harcamalar buraya dinamik olarak eklenecek -->
            </div>
        </div>

        <!-- Alt Sabit Alan ve Büyük Buton -->
        <div class="p-4 bg-white border-t border-orange-100">
            <button onclick="modalAc()" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-4 rounded-2xl shadow-[0_0_15px_rgba(234,88,12,0.4)] transition duration-200 text-lg flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
                </svg>
                HARCAMA EKLE
            </button>
        </div>
    </div>

    <!-- Harcama Ekle Modal / Ekranı -->
    <div id="harcama-modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50 backdrop-blur-sm">
        <div class="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl border-t-4 border-orange-600">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Yeni Harcama Ekle</h2>
            
            <form id="harcama-form" onsubmit="harcamaKaydet(event)" class="space-y-4">
                <!-- Kategori Seçimi -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Kategori</label>
                    <select id="kategori" required class="w-full p-3 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 focus:border-orange-500 focus:outline-none bg-white font-medium">
                        <option value="" disabled selected>Kategori Seçin</option>
                        <option value="Maket">Maket</option>
                        <option value="Sigara">Sigara</option>
                        <option value="Yemek">Yemek</option>
                        <option value="Cafe">Cafe</option>
                        <option value="Online Alışveriş">Online Alışveriş</option>
                        <option value="Yolculuk">Yolculuk</option>
                        <option value="Diğer">Diğer</option>
                    </select>
                </div>

                <!-- Tutar Girişi (Virgüllü) -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Tutar (TL)</label>
                    <input type="text" id="tutar" placeholder="0,00" required 
                           class="w-full p-3 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 focus:border-orange-500 focus:outline-none text-lg font-bold"
                           oninput="tutarBicimlendir(this)">
                </div>

                <!-- Butonlar -->
                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="modalKapat()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold py-3 rounded-xl transition duration-200">
                        İptal
                    </button>
                    <button type="submit" class="flex-1 bg-orange-600 hover:bg-orange-700 text-white font-semibold py-3 rounded-xl shadow-[0_0_10px_rgba(234,88,12,0.3)] transition duration-200">
                        Kaydet
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase ve Uygulama Mantığı -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBVtbl20mGQJda1QmqD9Bm-4PNyRBuWnUY",
            authDomain: "harcamalarimapp.firebaseapp.com",
            databaseURL: "https://harcamalarimapp-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "harcamalarimapp",
            storageBucket: "harcamalarimapp.firebasestorage.app",
            messagingSenderId: "518005508600",
            appId: "1:518005508600:web:ee7fe04274512394716e0d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.modalAc = function() {
            document.getElementById('harcama-modal').classList.remove('hidden');
            document.getElementById('harcama-modal').classList.add('flex');
        }

        window.modalKapat = function() {
            document.getElementById('harcama-modal').classList.add('hidden');
            document.getElementById('harcama-modal').classList.remove('flex');
            document.getElementById('harcama-form').reset();
        }

        window.tutarBicimlendir = function(input) {
            let value = input.value.replace(/\./g, '').replace(',', '.');
        }

        window.harcamaKaydet = function(event) {
            event.preventDefault();
            
            const kategori = document.getElementById('kategori').value;
            let tutarStr = document.getElementById('tutar').value.replace(',', '.');
            const tutar = parseFloat(tutarStr);

            if (isNaN(tutar)) {
                alert("Lütfen geçerli bir tutar girin.");
                return;
            }

            const tarih = new Date().toISOString();

            const harcamalarRef = ref(db, 'harcamalar');
            push(harcamalarRef, {
                kategori: kategori,
                tutar: tutar,
                tarih: tarih
            }).then(() => {
                modalKapat();
            }).catch((error) => {
                console.error("Kayıt hatası: ", error);
                alert("Harcama kaydedilemedi.");
            });
        }

        const harcamalarRef = ref(db, 'harcamalar');
        onValue(harcamalarRef, (snapshot) => {
            const data = snapshot.val();
            const listeDiv = document.getElementById('harcama-listesi');
            const bosMesaj = document.getElementById('bos-mesaj');
            
            listeDiv.innerHTML = '';

            if (data) {
                bosMesaj.classList.add('hidden');
                const harcamalar = Object.entries(data).reverse();

                harcamalar.forEach(([id, item]) => {
                    const tarihObj = new Date(item.tarih);
                    const tarihFormatli = tarihObj.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
                    
                    const itemElement = document.createElement('div');
                    itemElement.className = "bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center";
                    itemElement.innerHTML = `
                        <div>
                            <span class="inline-block px-3 py-1 text-xs font-bold bg-orange-50 text-orange-600 rounded-lg mb-1">${item.kategori}</span>
                            <p class="text-xs text-gray-400">${tarihFormatli}</p>
                        </div>
                        <div class="text-right">
                            <span class="text-lg font-black text-gray-800">${item.tutar.toLocaleString('tr-TR', { minimumFractionDigits: 2 })} TL</span>
                        </div>
                    `;
                    listeDiv.appendChild(itemElement);
                });
            } else {
                bosMesaj.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
